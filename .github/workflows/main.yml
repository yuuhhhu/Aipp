name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project (only if a zip exists)
        run: |
          zipfile=$(ls *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$zipfile" ]; then unzip -o "$zipfile"; else echo "No zip found, using repo files"; fi

      - name: Locate project folder
        run: |
          dir=$(dirname "$(find . -name settings.gradle.kts | head -n 1)")
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FreeNetVPN-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
